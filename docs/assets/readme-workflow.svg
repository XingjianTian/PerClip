<rect x="352" y="194" width="3" height="24" rx="1.5" fill="#7053b5"/>
<text x="372" y="201" font-size="12" font-weight="700" letter-spacing="1.4" fill="#7053b5">02 / ACCEPT</text>
<text x="372" y="238" font-size="22" font-weight="650" fill="#142536">Queue &amp; durable save</text>
