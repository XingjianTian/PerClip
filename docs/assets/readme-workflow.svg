<rect x="656" y="194" width="3" height="24" rx="1.5" fill="#7053b5"/>
<text x="676" y="201" font-size="12" font-weight="700" letter-spacing="1.4" fill="#7053b5">03 / PROCESS</text>
<text x="676" y="238" font-size="22" font-weight="650" fill="#142536">Process &amp; organize</text>
<text x="676" y="267" font-size="14" fill="#52677a">Worker · original asset storage</text>
