<text x="66" y="50" font-size="13" font-weight="700" letter-spacing="2.5" fill="#7053b5">PERCLIP / WORKFLOW</text>
<text x="48" y="100" font-size="36" font-weight="700" fill="#142536">Keep what matters. Find it again.</text>
<text x="48" y="127" font-size="16" fill="#52677a">Capture on Android, process on your server, return to your own knowledge.</text>
