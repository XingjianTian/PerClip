<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
<title id="title">PerClip workflow</title>
<desc id="desc">Capture on Android, process on your server, return to your own knowledge. Share &amp; quick notes → Queue &amp; durable save → Process &amp; organize → Find &amp; revisit.</desc>
