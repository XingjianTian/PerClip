server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name ${PERCLIP_PUBLIC_HOST};

    ssl_certificate      ${PERCLIP_TLS_CERT};
    ssl_certificate_key  ${PERCLIP_TLS_KEY};

    include log.conf;
    include acme_challenge.conf;

    location / {
        set $no_cache 1;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        include proxy_ip.conf;
        include proxy_custom.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://9;
    }

    location = /403.html {
        root html;
        internal;
    }

    include error_page.conf;
}
